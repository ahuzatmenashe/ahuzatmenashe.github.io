<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ahuzat Menashe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16120f; --ink-2:#1f1a15; --line:#3a3027; --sand:#efe6d8; --muted:#a89a88; --brass:#c9a46a; --brass-d:#a98550;
  --serif:"Frank Ruhl Libre","David Libre",Georgia,serif; --sans:"Heebo","Assistant",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--sand);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
.card{max-width:520px;margin:0 auto;background:var(--ink)}
.hero{position:relative;height:min(86svh,760px);min-height:520px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:settle 2.6s cubic-bezier(.2,.7,.2,1) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,18,15,.25) 0%,rgba(22,18,15,0) 30%,rgba(22,18,15,.78) 78%,var(--ink) 100%)}
.title{position:absolute;z-index:2;inset-inline:0;bottom:0;padding:0 28px 34px}
.kind{margin:0 0 6px;font-size:1rem;color:var(--brass);letter-spacing:.04em;animation:rise 1.4s .9s both}
h1{margin:0;font-family:"Cormorant Garamond",var(--serif);font-weight:600;font-size:clamp(3.6rem,19vw,5.4rem);line-height:.92;letter-spacing:.01em;text-align:right;color:var(--sand);animation:rise 1.4s .6s both}
.sub{margin:14px 0 0;max-width:30ch;font-size:1.05rem;color:var(--sand);opacity:.86;animation:rise 1.4s 1.2s both}
@keyframes settle{from{transform:scale(1.1)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.actions{padding:8px 24px 8px;display:grid;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 20px;border-radius:4px;border:1px solid var(--line);background:var(--ink-2);color:var(--sand);font:500 1.05rem var(--sans);text-decoration:none;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--brass)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.btn svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.fill svg.f,.btn svg.f{fill:currentColor;stroke:none}
.btn.main{background:var(--brass);border-color:var(--brass);color:#1a130b;font-weight:700;font-size:1.15rem;min-height:62px}
.btn.main:hover{background:var(--sand);border-color:var(--sand)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row.three{grid-template-columns:repeat(3,1fr);gap:10px}.row.three .btn{flex-direction:column;gap:8px;min-height:76px;padding:10px 6px;font-size:.95rem}
h2{margin:44px 28px 14px;font-family:var(--serif);font-weight:700;font-size:1.7rem;color:var(--sand)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 24px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail figure{margin:0;flex:0 0 78%;scroll-snap-align:center}
.rail img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;background:var(--ink-2)}
.videos{display:grid;gap:20px;padding:0 24px}.videos figure{margin:0}.videos video,.videos iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px;background:var(--ink-2)}.videos video{object-fit:contain}.videos figcaption{color:var(--muted);margin-top:8px}[hidden]{display:none!important}
.rail figcaption{margin-top:10px;font-size:.95rem;color:var(--muted)}
.end{margin:44px 24px 36px;padding-top:22px;border-top:1px solid var(--line);text-align:center;font-family:var(--serif);font-size:1.15rem;color:var(--brass)}
@media (prefers-reduced-motion:reduce){.hero img,.kind,h1,.sub{animation:none}}
@media (min-width:560px){.card{margin-block:24px;border:1px solid var(--line)}}
</style>
</head>
<body>
<main class="card">
  <header class="hero">
    <img src="/media/images/hero.jpg" alt="בריכת האחוזה בשקיעה">
    <div class="title">
      <p class="kind">וילת אירוח</p>
      <h1 dir="ltr">Ahuzat<br>Menashe</h1>
      <p class="sub">חווית אירוח בסטנדרט אחר.</p>
    </div>
  </header>

  <nav class="actions" aria-label="יצירת קשר">
    <a id="whatsapp-link" class="btn main" href="https://wa.me/972523338028" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M20.5 3.5A11 11 0 0 0 3.1 16.8L2 22l5.3-1.4A11 11 0 1 0 20.5 3.5Z"/><path d="M8.5 7.8c.3-.5.8-.5 1.1-.1l.9 1.5c.2.4.1.8-.2 1.1l-.5.6c.7 1.4 1.8 2.5 3.3 3.2l.6-.6c.3-.3.7-.4 1.1-.2l1.5.8c.5.3.5.8.1 1.4-.6.8-1.6 1.2-2.6 1-3-.7-5.5-3.2-6.3-6.1-.2-.9 0-1.7.5-2.4Z"/></svg>
      שלחו הודעה בוואטסאפ
    </a>
    <a id="phone-link" class="btn" href="tel:+972523338028">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
      <span id="phone-label">התקשרו 052-333-8028</span>
    </a>
    <a id="navigation-link" class="btn" href="https://waze.com/ul?q=%D7%9E%D7%95%D7%A9%D7%91%20%D7%A2%D7%9C%D7%9E%D7%94&navigate=yes" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21Z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
      <span id="navigation-label">ניווט למושב עלמה</span>
    </a>
    <div class="row three">
      <a id="instagram-link" class="btn" href="https://www.instagram.com/ahuzatmenashe" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="f" cx="17.2" cy="6.8" r="1.1"/></svg>
        אינסטגרם
      </a>
      <a id="tiktok-link" class="btn" href="https://www.tiktok.com/@ahuzatmenashe" target="_blank" rel="noopener">
        <svg class="f" viewBox="0 0 24 24"><path d="M19.6 7.6a4.8 4.8 0 0 1-3.8-4.3h-3.4v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a6 6 0 1 0 5.2 5.9V9.4a8 8 0 0 0 4.6 1.5V7.6Z"/></svg>
        טיקטוק
      </a>
      <a id="facebook-link" class="btn" href="https://www.facebook.com/share/19gNbbSRgN/?mibextid=wwXIfr" target="_blank" rel="noopener">
        <svg class="f" viewBox="0 0 24 24"><path d="M14 8.500V6.800c0-.8.2-1.300 1.400-1.300H17V2.600c-.3 0-1.200-.1-2.200-.1C12.600 2.500 11 3.800 11 6.300v2.200H8.500v3.200H11v8.800h3v-8.800h2.400l.4-3.200H14Z"/></svg>
        פייסבוק
      </a>
    </div>
  </nav>

  <h2 id="gallery-title">הווילה</h2>
  <section class="rail" aria-label="גלריית תמונות">
    <figure><img src="/media/images/pool.jpg" alt="הבריכה והחצר" loading="lazy"><figcaption>הבריכה</figcaption></figure>
    <figure><img src="/media/images/pergola.jpg" alt="פרגולה, שולחן אוכל וגריל" loading="lazy"><figcaption>פרגולה וגריל</figcaption></figure>
    <figure><img src="/media/images/garden.jpg" alt="החצר והדשא" loading="lazy"><figcaption>החצר</figcaption></figure>
    <figure><img src="/media/images/seating.jpg" alt="פינת ישיבה מקורה בחצר" loading="lazy"><figcaption>פינת ישיבה מקורה</figcaption></figure>
    <figure><img src="/media/images/bedroom.jpg" alt="חדר שינה עם יציאה לבריכה" loading="lazy"><figcaption>חדר שינה</figcaption></figure>
    <figure><img src="/media/images/living-room.jpg" alt="הסלון" loading="lazy"><figcaption>סלון</figcaption></figure>
    <figure><img src="/media/images/kitchen.jpg" alt="המטבח" loading="lazy"><figcaption>מטבח</figcaption></figure>
  </section>

  <section id="videos-section" hidden aria-labelledby="videos-title"><h2 id="videos-title">סרטונים</h2><div class="videos" id="videos-list"></div></section>
  <p class="end">אחוזת מנשה</p>
</main>
<script type="module" src="/assets/card.mjs"></script>
</body>
</html>
